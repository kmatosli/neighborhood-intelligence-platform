[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bronzeville-woodlawn-observatory"
version = "0.1.0"
description = "Bronzeville and Woodlawn civic data observatory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "tenacity>=8.5.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
  "geopandas>=1.0.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "pyogrio>=0.9.0",
  "pyyaml>=6.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-httpx>=0.30.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pandas-stubs>=2.2.0.240807",
  "types-pyyaml>=6.0.12.20260518",
  "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bw_observatory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bw_observatory"]

# geopandas, shapely, and pyogrio ship no type stubs. Untyped imports are allowed for
# these three only; everything in this project stays strictly typed.
[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*", "pyogrio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
