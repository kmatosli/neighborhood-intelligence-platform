[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bronzeville-woodlawn-observatory"
version = "0.1.0"
description = "Bronzeville and Woodlawn civic data observatory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "tenacity>=8.5.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-httpx>=0.30.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pandas-stubs>=2.2.0.240807",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bw_observatory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bw_observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
