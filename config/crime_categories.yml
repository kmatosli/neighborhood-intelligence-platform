# Crime groupings — the single source of truth.
#
# Values are official Chicago `primary_type` values from dataset ijzp-q8t2, matched exactly
# (case-insensitively). Grouping choices change what a trend looks like, so they are a
# methodological claim, not an implementation detail: they live here, they are published on
# the Methodology page, and they are NEVER duplicated inside application or React code.
# See docs/methodology/CRIME.md.
#
# IMPORTANT — these categories overlap and do NOT sum to the total.
#   * burglary is a subset of property_crime
#   * vehicle_related_crime is a subset of property_crime
#   * "OTHER OFFENSE", "NARCOTICS", "WEAPONS VIOLATION" and others belong to no category here
# Never present the categories as a breakdown of the total.

categories:
  violent_crime:
    label: Violent crime
    description: >-
      Reported incidents against a person. Counts reports, not convictions.
    primary_types:
      - HOMICIDE
      - CRIMINAL SEXUAL ASSAULT
      - CRIM SEXUAL ASSAULT       # the dataset's older spelling; both appear historically
      - ROBBERY
      - ASSAULT
      - BATTERY

  property_crime:
    label: Property crime
    description: >-
      Reported incidents against property.
    primary_types:
      - BURGLARY
      - THEFT
      - MOTOR VEHICLE THEFT
      - ARSON
      - CRIMINAL DAMAGE
      - CRIMINAL TRESPASS

  vehicle_related_crime:
    label: Vehicle-related crime
    description: >-
      Motor vehicle theft. NOTE: theft *from* a vehicle is recorded by Chicago in the
      `description` field, not in `primary_type`, so it is not counted here. This figure is
      therefore narrower than what a resident may mean by "car break-ins", and the page must
      not imply otherwise.
    primary_types:
      - MOTOR VEHICLE THEFT

  burglary:
    label: Burglary
    description: >-
      Reported burglary. A subset of property crime.
    primary_types:
      - BURGLARY

# ----------------------------------------------------------------------------------------
# Broad categories — a PARTITION, unlike the overlapping analytic `categories` above.
#
# Every published `primary_type` maps to exactly one broad category, so these DO sum to the
# total. Residents see six plain-language buckets instead of ~31 CPD codes. Any primary_type
# not listed here (a new or historical code) maps to `Other` via `unmapped_broad_category`;
# no record is ever silently dropped. The raw CPD `primary_type` stays available in the
# incident table and the category-driver table for anyone who wants the detail.
#
# Authored against the real distinct `primary_type` values in dataset ijzp-q8t2 (2006-2026).
# Judgement calls are documented in docs/methodology/CRIME.md:
#   * DECEPTIVE PRACTICE (fraud) is grouped under Property.
#   * OFFENSE INVOLVING CHILDREN, SEX OFFENSE, STALKING, KIDNAPPING, INTIMIDATION and
#     HUMAN TRAFFICKING are person-directed and grouped under Violent.
#   * CONCEALED CARRY LICENSE VIOLATION is grouped under Weapons.
# ----------------------------------------------------------------------------------------

unmapped_broad_category: other

broad_categories:
  violent_crime:
    label: Violent crime
    description: >-
      Reported incidents directed at a person. Counts reports, not convictions.
    primary_types:
      - HOMICIDE
      - CRIMINAL SEXUAL ASSAULT
      - CRIM SEXUAL ASSAULT
      - ROBBERY
      - ASSAULT
      - BATTERY
      - SEX OFFENSE
      - OFFENSE INVOLVING CHILDREN
      - STALKING
      - KIDNAPPING
      - INTIMIDATION
      - HUMAN TRAFFICKING

  property_crime:
    label: Property crime
    description: >-
      Reported incidents against property, including theft, damage, and fraud.
    primary_types:
      - THEFT
      - MOTOR VEHICLE THEFT
      - BURGLARY
      - CRIMINAL DAMAGE
      - CRIMINAL TRESPASS
      - ARSON
      - DECEPTIVE PRACTICE

  public_order:
    label: Public order
    description: >-
      Reported public-order offenses, such as public-peace, liquor, and vice offenses.
    primary_types:
      - PUBLIC PEACE VIOLATION
      - INTERFERENCE WITH PUBLIC OFFICER
      - LIQUOR LAW VIOLATION
      - PROSTITUTION
      - GAMBLING
      - PUBLIC INDECENCY
      - OBSCENITY

  weapons:
    label: Weapons
    description: >-
      Reported weapons offenses.
    primary_types:
      - WEAPONS VIOLATION
      - CONCEALED CARRY LICENSE VIOLATION

  narcotics:
    label: Narcotics
    description: >-
      Reported narcotics offenses.
    primary_types:
      - NARCOTICS
      - OTHER NARCOTIC VIOLATION

  other:
    label: Other
    description: >-
      Reported incidents that do not fall into the categories above, plus any primary type
      not yet mapped. Never silently dropped.
    primary_types:
      - OTHER OFFENSE
      - NON-CRIMINAL
      - NON - CRIMINAL
      - NON-CRIMINAL (SUBJECT SPECIFIED)
      - RITUALISM
      - DOMESTIC VIOLENCE

# ----------------------------------------------------------------------------------------
# Enforcement-generated primary types.
#
# These offences are recorded almost only when police act: verified on the September 2026
# release, PROSTITUTION reports carry an arrest flag on 91-99% of records depending on the
# year, against 16.1% for all crime citywide in 2025. Their counts therefore move with
# enforcement activity and CANNOT be read as a measure of how often the behaviour occurs.
#
# Why this matters: citywide 2006 -> 2025, gambling fell 99.0%, prostitution 97.3%,
# narcotics 86.7% and liquor-law 82.4%, while victim-reported battery fell 47.1%. A reader
# shown only the first group would conclude the neighbourhood changed far more than the
# victim-reported series supports.
#
# Every figure derived from a type listed here must carry the enforcement-generated label.
# See docs/methodology/CRIME.md.
# ----------------------------------------------------------------------------------------

enforcement_generated_primary_types:
  - PROSTITUTION
  - NARCOTICS
  - OTHER NARCOTIC VIOLATION
  - GAMBLING
  - LIQUOR LAW VIOLATION
  - WEAPONS VIOLATION
  - CONCEALED CARRY LICENSE VIOLATION
  - PUBLIC INDECENCY
  - OBSCENITY

# ----------------------------------------------------------------------------------------
# Overlays — labelled analytical subsets, NOT part of the broad_categories partition.
#
# A record can belong to several overlays (a NARCOTICS report is in `narcotics` and in
# `enforcement_generated`), so overlay counts are never stacked, never summed to a total and
# never drawn as shares of 100%. Each is published with its count, its share of the total
# and that denominator, side by side with the partition. Owner decision 2026-10-27.
#
# Membership is by `primary_types` (the source's primary_type) or `fbi_codes` (the source's
# `fbi_code`, its NIBRS classification), never by description text.
# ----------------------------------------------------------------------------------------

overlays:
  enforcement_generated:
    label: Enforcement-generated offences
    description: >-
      Offences recorded almost only when police act (the list above). A change in this count
      can reflect a change in enforcement activity rather than in the behaviour.
    primary_types_from: enforcement_generated_primary_types

  narcotics:
    label: Narcotics
    description: Reported narcotics offences. Also enforcement-generated.
    primary_types:
      - NARCOTICS
      - OTHER NARCOTIC VIOLATION

  motor_vehicle_theft:
    label: Motor vehicle theft
    description: Reported motor vehicle thefts. Also counted in Property crime.
    primary_types:
      - MOTOR VEHICLE THEFT

  # Approved 2026-10-27 (CA-09). An unweighted subset — NOT a severity score, a harm score or
  # a neighbourhood safety ranking. 01B (involuntary manslaughter / reckless homicide) and
  # every 08A/08B record are excluded, including IUCR 0440, 0454, 0554, 0545 and 0484 whose
  # descriptions say "aggravated" but which the source codes as simple assault or battery.
  # Attempts stay where the source codes them inside these classes. Sensitive victim classes
  # (domestic, child, unborn child, senior) count toward the total and are NEVER broken out.
  selected_fbi_violent:
    label: Selected FBI/NIBRS violent-offense classes
    status: approved
    description: >-
      Reports the source classifies as murder and non-negligent manslaughter (01A), criminal
      sexual assault (02), robbery (03), aggravated assault (04A) or aggravated battery (04B).
      An unweighted subset, not a measure of severity or safety.
    fbi_codes: ["01A", "02", "03", "04A", "04B"]
    caveats:
      - >-
        Includes aggravated assaults and batteries against police officers and protected
        employees where the source codes them 04A/04B; part of that count reflects police
        contact itself.
      - >-
        Shown only as a total. Its parts are never broken out, so no figure about a sensitive
        victim class is published.
